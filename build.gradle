plugins {
	id 'fabric-loom' version '1.12-SNAPSHOT'
	id 'maven-publish'
	id 'jacoco'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories for mod dependencies here
	// Loom automatically includes essential Minecraft repositories
}

// Fabric data generation
fabricApi {
	configureDataGeneration {
		client = true
	}
}

configurations {
	mockitoAgent
}

dependencies {
	// Minecraft & Mappings
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-networking-api-v1:${project.fabric_version}"

	// Database
	include implementation("org.xerial:sqlite-jdbc:${project.sqlite_jdbc_version}")

	// Code Generation
	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

	// Dependency Injection
	modImplementation "com.google.inject:guice:${project.guice_version}"
	include "com.google.inject:guice:${project.guice_version}"

	// YAML Serializing
	modImplementation "com.fasterxml.jackson.core:jackson-databind:${project.jackson_version}"
	modImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${project.jackson_version}"
	include "com.fasterxml.jackson.core:jackson-databind:${project.jackson_version}"
	include "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${project.jackson_version}"

	// Testing
	testImplementation "org.junit.jupiter:junit-jupiter-api:${project.junit_version}"
	runtimeOnly "org.junit.jupiter:junit-jupiter-engine:${project.junit_engine_version}"
	testImplementation "org.junit.platform:junit-platform-launcher:${project.junit_launcher_version}"

	testImplementation "org.mockito:mockito-core:${project.mockito_version}"
	mockitoAgent("org.mockito:mockito-core:${project.mockito_version}") {
		transitive = false
	}
	testImplementation "org.mockito:mockito-junit-jupiter:${project.mockito_version}"
}

// Process resources with version replacement
processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Java compilation settings
tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Test configuration
tasks.test {
	useJUnitPlatform()
	jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile.absolutePath}"
	finalizedBy("jacocoTestReport")
}

jacoco {
	toolVersion = "0.8.13"
}

tasks.jacocoTestReport {
	dependsOn(tasks.test)
	reports {
		xml.required.set(true)
		html.required.set(true)
	}
}

// Packaging
jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Publishing config
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Publishing repositories
	}
}
